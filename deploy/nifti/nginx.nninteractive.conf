worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types application/javascript text/css application/json;
  server {
    listen 1026;
    absolute_redirect off;
    client_max_body_size 520M;
    # On a direct load, rebuild in-memory native sources through the gateway.
    # SPA navigation into the workbench does not issue this HTTP request.
    location = /nifti-viewer/nifti { return 302 /nifti$is_args$args; }
    location /_nifti-files/ { internal; alias /var/nifti-images/; }
    location /_nifti-stream-cache/ {
      internal;
      alias /var/nifti-stream-cache/;
      etag off;
      add_header ETag $upstream_http_etag;
      add_header X-Nifti-Cache-Key $upstream_http_x_nifti_cache_key;
      add_header X-Nifti-Frame $upstream_http_x_nifti_frame;
    }
    # AI returns a sparse binary grid in multipart; gzip changes only transport bytes.
    location ~ ^/monai/nifti-images/[^/]+/infer$ {
      gzip_types *;
      gzip_proxied any;
      gzip_vary on;
      proxy_pass http://backend:8002;
      rewrite ^/monai/(.*)$ /$1 break;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
    location /monai/ {
      proxy_pass http://backend:8002/;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
    location /deployment-manifests/ {
      alias /var/www/manifests/;
      add_header Cache-Control no-store;
    }
    # Content hashes change on rebuild; reuse these large bundles on reload.
    location ~ "^/[^/]+\.[0-9a-f]{8,}\.(js|css)$" {
      root /var/www/html;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /app.bundle.css {
      root /var/www/html;
      add_header Cache-Control no-cache;
    }
    location / {
      root /var/www/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control no-store;
    }
  }
}
